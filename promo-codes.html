<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e293b">
    <title>Pro X - Promo Code Management</title>

    <!-- Firebase SDK v8 CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* ── CSS Variables ── */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --border-color: #e0e0e0;
            --border-light: rgba(0,0,0,0.05);
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-light: rgba(102,126,234,0.1);
            --success: #28a745;
            --warning: #ff9800;
            --danger: #dc3545;
            --pink: #db2777;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.15);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.3);
        }

        html.dark-mode {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: rgba(30,41,59,0.8);
            --bg-gradient-1: #1e293b;
            --bg-gradient-2: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --border-color: rgba(148,163,184,0.2);
            --border-light: rgba(148,163,184,0.1);
            --accent-primary: #60a5fa;
            --accent-secondary: #3b82f6;
            --accent-light: rgba(96,165,250,0.1);
            --success: #22c55e;
            --warning: #f97316;
            --danger: #ef4444;
            --pink: #f472b6;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ── Container ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid rgba(255,255,255,0.2);
        }

        .header-left h1 { font-size: 28px; margin-bottom: 5px; font-weight: 600; }
        .header-left .subtitle { font-size: 14px; opacity: 0.9; }

        .header-right { display: flex; align-items: center; gap: 15px; }

        .admin-welcome { font-size: 14px; font-weight: 500; }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }

        .theme-toggle-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            width: 44px; height: 44px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .theme-toggle-btn svg { width: 22px; height: 22px; position: absolute; transition: opacity 0.3s ease, transform 0.3s ease; }
        .sun-icon { opacity: 1; transform: rotate(0deg); }
        .moon-icon { opacity: 0; transform: rotate(-180deg); }
        html.dark-mode .sun-icon { opacity: 0; transform: rotate(180deg); }
        html.dark-mode .moon-icon { opacity: 1; transform: rotate(0deg); }

        /* ── Stats ── */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            padding: 30px;
            background: var(--bg-secondary);
        }
        .stat-card {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .stat-card .label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-card .value { font-size: 30px; font-weight: 700; color: var(--accent-primary); }

        /* ── Toolbar ── */
        .toolbar {
            padding: 20px 30px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .search-box { flex: 1; min-width: 220px; }
        .search-box input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .search-box input::placeholder { color: var(--text-tertiary); }
        .search-box input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-light); background: var(--bg-primary); }

        .filter-btn {
            padding: 10px 18px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }
        .filter-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .filter-btn.active { background: var(--accent-primary); color: var(--bg-primary); border-color: var(--accent-primary); }

        .create-btn {
            padding: 11px 22px;
            background: var(--pink);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .create-btn:hover { opacity: 0.88; transform: translateY(-2px); }

        /* ── Table ── */
        .section { padding: 30px; }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-primary);
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%); color: white; }
        th { padding: 14px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        tbody tr { border-bottom: 1px solid var(--border-light); transition: background 0.2s; }
        tbody tr:hover { background: var(--bg-secondary); }
        td { padding: 14px 16px; font-size: 14px; color: var(--text-primary); }

        /* ── Badges ── */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        html:not(.dark-mode) .badge-active   { background: #d4edda; color: #155724; }
        html.dark-mode       .badge-active   { background: rgba(34,197,94,0.2); color: #86efac; }
        html:not(.dark-mode) .badge-inactive { background: #f8d7da; color: #721c24; }
        html.dark-mode       .badge-inactive { background: rgba(239,68,68,0.2); color: #fca5a5; }
        html:not(.dark-mode) .badge-pct      { background: #e0e7ff; color: #3730a3; }
        html.dark-mode       .badge-pct      { background: rgba(96,165,250,0.15); color: #93c5fd; }
        html:not(.dark-mode) .badge-fixed    { background: #fef9c3; color: #92400e; }
        html.dark-mode       .badge-fixed    { background: rgba(245,158,11,0.15); color: #fbbf24; }

        /* ── Action buttons ── */
        .action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 6px;
        }
        .action-btn:last-child { margin-right: 0; }
        .btn-toggle-on  { background: var(--warning); color: white; }
        .btn-toggle-off { background: var(--success);  color: white; }
        .btn-delete     { background: var(--danger);   color: white; }
        .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }

        /* ── Code cell ── */
        .code-cell {
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--pink);
        }

        /* ── Empty / Loading ── */
        .empty-state, .loading-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); font-size: 15px; }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 20px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.25s ease;
            border: 1px solid var(--border-color);
        }
        @keyframes modalIn {
            from { transform: translateY(-40px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: white;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 20px 20px 0 0;
        }
        .modal-header h2 { font-size: 20px; font-weight: 600; }
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }

        .modal-body { padding: 28px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { outline: none; border-color: var(--accent-primary); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .modal-footer {
            padding: 18px 28px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-radius: 0 0 20px 20px;
        }
        .btn-cancel { padding: 10px 20px; border: 2px solid var(--border-color); background: transparent; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-primary); transition: all 0.3s; }
        .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }
        .btn-save { padding: 10px 24px; background: var(--pink); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.3s; }
        .btn-save:hover { opacity: 0.88; }

        /* ── Success toast ── */
        .toast {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--success);
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
            z-index: 2000;
            font-size: 14px;
            font-weight: 600;
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight {
            from { transform: translateX(360px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }

        /* ── Usage bar ── */
        .usage-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .usage-bar { height: 6px; border-radius: 3px; background: var(--border-color); flex: 1; overflow: hidden; }
        .usage-bar-fill { height: 100%; border-radius: 3px; background: var(--accent-primary); transition: width 0.4s; }
        .usage-text { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; text-align: center; }
            .toolbar { flex-direction: column; }
            .search-box { min-width: 100%; }
            .form-row { grid-template-columns: 1fr; }
            table { min-width: 700px; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="mobile-app.css">
</head>
<body>
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>🎟 Promo Code Management</h1>
                <div class="subtitle">Create and manage promo &amp; referral codes</div>
            </div>
            <div class="header-right">
                <span class="admin-welcome" id="adminWelcome">Welcome, Admin</span>
                <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="label">Total Codes</div>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active</div>
                <div class="value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Inactive</div>
                <div class="value" id="stat-inactive">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Uses</div>
                <div class="value" id="stat-uses">0</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by code or description..." oninput="page.handleSearch(this.value)">
            </div>
            <button type="button" class="filter-btn active" data-filter="all"     onclick="page.setFilter('all')">All</button>
            <button type="button" class="filter-btn"        data-filter="active"  onclick="page.setFilter('active')">Active</button>
            <button type="button" class="filter-btn"        data-filter="inactive" onclick="page.setFilter('inactive')">Inactive</button>
            <button type="button" class="create-btn"        onclick="page.openCreateModal()">+ New Code</button>
        </div>

        <!-- Table -->
        <div class="section">
            <div id="loadingState" class="loading-state">Loading promo codes...</div>
            <div id="emptyState"   class="empty-state"   style="display:none;">No promo codes found.</div>
            <div class="table-container" id="tableContainer" style="display:none;">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Description</th>
                            <th>Discount</th>
                            <th>Usage</th>
                            <th>Expires</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="modal" id="codeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Promo Code</h2>
                <button type="button" class="close-btn" onclick="page.closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="fCode">Code *</label>
                    <input type="text" id="fCode" placeholder="e.g. SAVE20" maxlength="20" style="text-transform:uppercase;">
                </div>
                <div class="form-group">
                    <label for="fDesc">Description</label>
                    <textarea id="fDesc" placeholder="e.g. 20% off for new providers"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fType">Discount Type *</label>
                        <select id="fType">
                            <option value="percentage">Percentage (%)</option>
                            <option value="fixed">Fixed Amount ($)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fValue">Discount Value *</label>
                        <input type="number" id="fValue" placeholder="e.g. 20" min="1" max="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fMaxUses">Max Uses (blank = unlimited)</label>
                        <input type="number" id="fMaxUses" placeholder="e.g. 100" min="1">
                    </div>
                    <div class="form-group">
                        <label for="fExpiry">Expiry Date (optional)</label>
                        <input type="date" id="fExpiry">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="page.closeModal()">Cancel</button>
                <button type="button" class="btn-save"   onclick="page.saveCode()">Save Code</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="pageToast" style="display:none;"></div>

    <script>
        // ── Firebase ──
        const firebaseConfig = {
            apiKey: "AIzaSyC5MLrT34n4wsJaPPmAYNCT8h_qQDPQ5jU",
            authDomain: "phototester555.firebaseapp.com",
            projectId: "phototester555",
            storageBucket: "phototester555.firebasestorage.app",
            messagingSenderId: "953997763616",
            appId: "1:953997763616:web:4ac177ad8e79c5f38b8845"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db   = firebase.firestore();

        // ── Theme ──
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // ── Page controller ──
        const page = {
            codes:       [],
            filter:      'all',
            search:      '',
            editId:      null,
            currentAdmin: null,

            async init() {
                auth.onAuthStateChanged(async (user) => {
                    if (!user) { window.location.href = 'index.html'; return; }
                    const adminDoc = await db.collection('admin_users').doc(user.uid).get();
                    if (!adminDoc.exists || !adminDoc.data().isActive) {
                        await auth.signOut();
                        window.location.href = 'index.html';
                        return;
                    }
                    this.currentAdmin = { uid: user.uid, email: user.email, ...adminDoc.data() };
                    document.getElementById('adminWelcome').textContent = `Welcome, ${this.currentAdmin.name || user.email}`;
                    document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut().then(() => window.location.href = 'index.html'));
                    this.listenCodes();
                });
            },

            listenCodes() {
                db.collection('promo_codes').orderBy('createdAt', 'desc').onSnapshot(snap => {
                    this.codes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    this.updateStats();
                    this.render();
                }, err => console.error('Error loading promo codes:', err));
            },

            updateStats() {
                const active   = this.codes.filter(c => c.isActive).length;
                const inactive = this.codes.filter(c => !c.isActive).length;
                const uses     = this.codes.reduce((s, c) => s + (c.usageCount || 0), 0);
                document.getElementById('stat-total').textContent   = this.codes.length;
                document.getElementById('stat-active').textContent  = active;
                document.getElementById('stat-inactive').textContent = inactive;
                document.getElementById('stat-uses').textContent    = uses;
            },

            setFilter(f) {
                this.filter = f;
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
                this.render();
            },

            handleSearch(v) {
                this.search = v.toLowerCase();
                this.render();
            },

            getFiltered() {
                return this.codes.filter(c => {
                    const matchFilter = this.filter === 'all'
                        || (this.filter === 'active'   &&  c.isActive)
                        || (this.filter === 'inactive' && !c.isActive);
                    const matchSearch = !this.search
                        || c.code.toLowerCase().includes(this.search)
                        || (c.description || '').toLowerCase().includes(this.search);
                    return matchFilter && matchSearch;
                });
            },

            render() {
                const list = this.getFiltered();
                const loading  = document.getElementById('loadingState');
                const empty    = document.getElementById('emptyState');
                const tbl      = document.getElementById('tableContainer');
                const tbody    = document.getElementById('tableBody');

                loading.style.display = 'none';

                if (list.length === 0) {
                    empty.style.display = 'block';
                    tbl.style.display   = 'none';
                    return;
                }
                empty.style.display = 'none';
                tbl.style.display   = 'block';

                tbody.innerHTML = list.map(c => {
                    const discount = c.discountType === 'percentage'
                        ? `<span class="badge badge-pct">${c.discountValue}% OFF</span>`
                        : `<span class="badge badge-fixed">$${c.discountValue} OFF</span>`;

                    const maxUses  = c.maxUses || null;
                    const used     = c.usageCount || 0;
                    const pct      = maxUses ? Math.min(100, Math.round(used / maxUses * 100)) : 0;
                    const usageHtml = maxUses
                        ? `<div class="usage-bar-wrap">
                               <div class="usage-bar"><div class="usage-bar-fill" style="width:${pct}%"></div></div>
                               <span class="usage-text">${used}/${maxUses}</span>
                           </div>`
                        : `<span class="usage-text">${used} uses</span>`;

                    const expiry   = c.expiresAt ? new Date(c.expiresAt.toDate()).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';
                    const expired  = c.expiresAt && c.expiresAt.toDate() < new Date();
                    const statusBadge = (!c.isActive || expired)
                        ? `<span class="badge badge-inactive">${expired ? 'Expired' : 'Inactive'}</span>`
                        : `<span class="badge badge-active">Active</span>`;

                    const toggleLabel = c.isActive ? 'Deactivate' : 'Activate';
                    const toggleClass = c.isActive ? 'btn-toggle-on' : 'btn-toggle-off';

                    return `<tr>
                        <td><span class="code-cell">${c.code}</span></td>
                        <td>${c.description || '—'}</td>
                        <td>${discount}</td>
                        <td>${usageHtml}</td>
                        <td>${expiry}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button type="button" class="action-btn ${toggleClass}" onclick="page.toggleCode('${c.id}', ${c.isActive})">${toggleLabel}</button>
                            <button type="button" class="action-btn btn-delete"      onclick="page.deleteCode('${c.id}', '${c.code}')">Delete</button>
                        </td>
                    </tr>`;
                }).join('');
            },

            openCreateModal() {
                this.editId = null;
                document.getElementById('modalTitle').textContent = 'New Promo Code';
                document.getElementById('fCode').value    = '';
                document.getElementById('fDesc').value    = '';
                document.getElementById('fType').value    = 'percentage';
                document.getElementById('fValue').value   = '';
                document.getElementById('fMaxUses').value = '';
                document.getElementById('fExpiry').value  = '';
                document.getElementById('codeModal').classList.add('show');
            },

            closeModal() {
                document.getElementById('codeModal').classList.remove('show');
            },

            async saveCode() {
                const code  = document.getElementById('fCode').value.trim().toUpperCase();
                const desc  = document.getElementById('fDesc').value.trim();
                const type  = document.getElementById('fType').value;
                const val   = parseFloat(document.getElementById('fValue').value);
                const maxU  = document.getElementById('fMaxUses').value ? parseInt(document.getElementById('fMaxUses').value) : null;
                const exp   = document.getElementById('fExpiry').value;

                if (!code)           { alert('Code is required.'); return; }
                if (isNaN(val) || val <= 0) { alert('Discount value must be a positive number.'); return; }
                if (type === 'percentage' && val > 100) { alert('Percentage cannot exceed 100.'); return; }

                const data = {
                    code,
                    description: desc,
                    discountType: type,
                    discountValue: val,
                    maxUses: maxU,
                    expiresAt: exp ? firebase.firestore.Timestamp.fromDate(new Date(exp)) : null,
                    isActive: true,
                    usageCount: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: this.currentAdmin.uid,
                    createdByName: this.currentAdmin.name || this.currentAdmin.email
                };

                try {
                    // Prevent duplicate codes
                    const exists = await db.collection('promo_codes').where('code', '==', code).get();
                    if (!exists.empty) { alert(`Code "${code}" already exists.`); return; }

                    await db.collection('promo_codes').add(data);
                    this.closeModal();
                    this.showToast(`✅ Code "${code}" created!`);
                } catch (e) {
                    console.error(e);
                    alert('Error creating code. Please try again.');
                }
            },

            async toggleCode(id, currentlyActive) {
                try {
                    await db.collection('promo_codes').doc(id).update({ isActive: !currentlyActive });
                    this.showToast(currentlyActive ? 'Code deactivated.' : '✅ Code activated!');
                } catch (e) {
                    console.error(e);
                    alert('Error updating code.');
                }
            },

            async deleteCode(id, code) {
                if (!confirm(`Delete code "${code}"? This cannot be undone.`)) return;
                try {
                    await db.collection('promo_codes').doc(id).delete();
                    this.showToast(`Code "${code}" deleted.`);
                } catch (e) {
                    console.error(e);
                    alert('Error deleting code.');
                }
            },

            showToast(msg) {
                const t = document.getElementById('pageToast');
                t.textContent = msg;
                t.className   = 'toast';
                t.style.display = 'block';
                clearTimeout(this._toastTimer);
                this._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
            }
        };

        // Force uppercase on code input
        document.getElementById('fCode').addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        page.init();
    </script>
    <script src="mobile-app.js"></script>
</body>
</html>
