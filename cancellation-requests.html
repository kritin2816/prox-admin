    <style>

<body>
    <div class="container">
        <div class="header">
            <h1>🔄 Cancellation Requests Management</h1>
            <p>Review and process booking cancellation requests with comprehensive details</p>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="stat-pending">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-approved">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-denied">0</div>
                <div class="stat-label">Denied</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total</div>
            </div>
        </div>

        <div class="content">
            <div class="filters-section">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="pending">⏳ Pending</button>
                    <button class="filter-tab" data-status="approved">✅ Approved</button>
                    <button class="filter-tab" data-status="denied">❌ Denied</button>
                    <button class="filter-tab" data-status="all">📋 All Requests</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Loading cancellation requests...</div>
            </div>
            <div id="requests-grid" class="cards-grid"></div>
        </div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Request Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5MLrT34n4wsJaPPmAYNCT8h_qQDPQ5jU",
            authDomain: "phototester555.firebaseapp.com",
            projectId: "phototester555",
            storageBucket: "phototester555.firebasestorage.app",
            messagingSenderId: "953997763616",
            appId: "1:953997763616:web:4ac177ad8e79c5f38b8845",
            measurementId: "G-6VS0G0NQ7K"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentFilter = 'pending';
        let currentRequest = null;
        let stats = { pending: 0, approved: 0, denied: 0, total: 0 };
        let allRequests = [];

        const cache = {
            bookings: {},
            users: {},
            providers: {}
        };

        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    console.log('No user logged in, redirecting to login');
                    window.location.href = 'index.html';
                    return;
                }

                try {
                    const adminDoc = await db.collection('admin_users').doc(user.uid).get();
                    if (!adminDoc.exists || !adminDoc.data().isActive) {
                        console.log('User is not an active admin, signing out');
                        await firebase.auth().signOut();
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (error) {
                    console.error('Error verifying admin status:', error);
                    await firebase.auth().signOut();
                    window.location.href = 'index.html';
                    return;
                }

                initializeFilters();
                loadAllRequests();
            });
        });

        function initializeFilters() {
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.status;
                    displayFilteredRequests();
                });
            });
        }

        async function loadAllRequests() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';

            try {
                const snapshot = await db.collection('cancellation_requests')
                    .orderBy('when', 'desc')
                    .get();

                stats = { pending: 0, approved: 0, denied: 0, total: snapshot.size };
                allRequests = [];

                for (const doc of snapshot.docs) {
                    const data = { id: doc.id, ...doc.data() };
                    allRequests.push(data);
                    
                    const status = (data.status || 'pending').toLowerCase();
                    if (stats[status] !== undefined) stats[status]++;
                }

                document.getElementById('stat-pending').textContent = stats.pending;
                document.getElementById('stat-approved').textContent = stats.approved;
                document.getElementById('stat-denied').textContent = stats.denied;
                document.getElementById('stat-total').textContent = stats.total;

                loadingEl.style.display = 'none';
                displayFilteredRequests();
            } catch (error) {
                console.error('Error loading requests:', error);
                loadingEl.innerHTML = `<div class="empty-state"><h3>⚠️ Error</h3><p>${error.message}</p></div>`;
            }
        }

        async function displayFilteredRequests() {
            const gridEl = document.getElementById('requests-grid');
            gridEl.innerHTML = '';

            let filteredRequests = allRequests;
            if (currentFilter !== 'all') {
                filteredRequests = allRequests.filter(req => {
                    const status = (req.status || 'pending').toLowerCase();
                    return status === currentFilter;
                });
            }

            if (filteredRequests.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        <h3>No Requests Found</h3>
                        <p>No cancellation requests match the selected filter</p>
                    </div>
                `;
                return;
            }

            for (const data of filteredRequests) {
                const booking = await getBooking(data.bookingId);
                const card = createCompactCard(data, booking);
                gridEl.appendChild(card);
            }
        }

        // Helper: calculate refund from the ADVANCE PAID base, not full booking value
        function calculateRefund(advancePaidAmount, percent) {
            if (!advancePaidAmount || !percent) return 0;
            return Math.round((advancePaidAmount * percent / 100) * 100) / 100;
        }
        // Helper: derive advance paid from booking data
        function getAdvancePaid(booking) {
            const total = Number(booking?.estimatedSubtotal || booking?.selectedPricing?.price || booking?.amount || 0);
            return Number(booking?.paymentStatus?.advanceAmount ?? Math.ceil(total * 0.1));
        }

        function createCompactCard(data, booking) {
            const card = document.createElement('div');
            card.className = 'request-card';
            card.onclick = () => openDetailModal(data);

            const status = (data.status || 'pending').toLowerCase();
            const badgeClass = `badge-${status}`;
            const serviceTitle = booking?.serviceName || 'Unknown Service';
            const coverImage = booking?.serviceImageUrl || booking?.imageUrls?.[0] || 'https://via.placeholder.com/400x300?text=No+Image';
            const customerName = booking?.customerName || data.who || 'Unknown Customer';
            const bookingAmount = booking?.estimatedSubtotal || booking?.selectedPricing?.price || booking?.amount || 0;

            card.innerHTML = `
                <div class="card-image-wrapper">
                    <img src="${coverImage}" class="card-image" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                    <div class="card-badge ${badgeClass}">${status.toUpperCase()}</div>
                </div>
                <div class="card-content">
                    <div class="card-title">${escapeHtml(serviceTitle)}</div>
                    <div class="card-meta">
                        <div class="card-info">
                            <span class="card-info-icon">👤</span>
                            <span>${escapeHtml(customerName)}</span>
                        </div>
                        <div class="card-info">
                            <span class="card-info-icon">📁</span>
                            <span>${escapeHtml(booking?.category || 'N/A')}</span>
                        </div>
                        <div class="card-info">
                            <span class="card-info-icon">💰</span>
                            <span>₹${bookingAmount.toLocaleString('en-IN')}</span>
                        </div>
                        ${data.refundPercent !== undefined ? `
                        <div class="card-info" style="color: #28a745; font-weight: 600;">
                            <span class="card-info-icon">💵</span>
                            <span>Refund: ${data.refundPercent}% (₹${calculateRefund(bookingAmount, data.refundPercent).toLocaleString('en-IN')})</span>
                        </div>` : ''}
                    </div>
                    <div class="card-date">🕐 ${formatDate(data.when)}</div>
                </div>
            `;

            return card;
        }

        async function openDetailModal(data) {
            currentRequest = data;
            
            const booking = await getBooking(data.bookingId);
            const customer = booking ? await getUser(booking.customerId) : await getUser(data.customerId);
            const provider = booking ? await getProvider(booking.providerId) : null;

            const serviceTitle = booking?.serviceName || 'Unknown Service';
            document.getElementById('modal-title').textContent = `Cancellation Request - ${serviceTitle}`;

            let content = '';

            const heroImage = booking?.serviceImageUrl || booking?.imageUrls?.[0] || null;

                `;

            if (booking) {
                content += `

                        <h3>📋 Service Details</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Service Name</div>
                                <div class="info-value">${escapeHtml(booking.serviceName)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Category</div>
                                <div class="info-value">${escapeHtml(booking.category)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Type</div>
                                <div class="info-value">${escapeHtml(booking.type || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Duration</div>
                                <div class="info-value">${escapeHtml(booking.duration || 'N/A')}</div>
                            </div>
                        </div>
                    </div>
                `;

                if (booking.imageUrls && booking.imageUrls.length > 0) {
                    content += `
                        <div class="section">
                            <h3>🖼️ Service Images</h3>
                            <div class="image-gallery">
                                ${booking.imageUrls.map(img => `
                                    <img src="${img}" class="gallery-image" onclick="window.open('${img}', '_blank')" onerror="this.style.display='none'">
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                const bookingAmount = booking.estimatedSubtotal || booking.selectedPricing?.price || booking.amount || 0;

                content += `
                    <div class="section">
                        <h3>📅 Booking Information</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Booking ID</div>
                                <div class="info-value">${escapeHtml(data.bookingId || booking.bookingId)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Date</div>
                                <div class="info-value">${escapeHtml(booking.selectedDate || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Time</div>
                                <div class="info-value">${escapeHtml(booking.selectedTime || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Location</div>
                                <div class="info-value">${escapeHtml(booking.location || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Booking Amount</div>
                                <div class="info-value">₹${bookingAmount.toLocaleString('en-IN')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value">${escapeHtml(booking.status || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Payment Method</div>
                                <div class="info-value">${escapeHtml(booking.paymentMethod || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Payment Status</div>
                                <div class="info-value">
                                    <span class="payment-status ${booking.paymentConfirmed ? 'payment-confirmed' : 'payment-pending'}">
                                        ${booking.paymentConfirmed ? '✓ Confirmed' : '⏳ Pending'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (customer) {
                const customerName = customer.fullName || `${customer.firstName || ''} ${customer.lastName || ''}`.trim() || booking?.customerName || 'Unknown Customer';
                content += `
                    <div class="section">
                        <h3>👤 Customer Information</h3>
                        <div class="user-card">
                            ${customer.profilePhoto ? 
                                `<img src="${customer.profilePhoto}" class="user-avatar" onerror="this.outerHTML='<div class=\\'user-avatar-placeholder\\'>${getInitials(customer.firstName, customer.lastName)}</div>'">` :
                                `<div class="user-avatar-placeholder">${getInitials(customer.firstName, customer.lastName)}</div>`
                            }
                            <div class="user-details">
                                <h4>${escapeHtml(customerName)}</h4>
                                <p>📧 ${escapeHtml(customer.email || customer.identity?.email || 'N/A')}</p>
                                <p>📞 ${escapeHtml(customer.phone || customer.identity?.phone || booking?.customerPhone || 'N/A')}</p>
                                <p>👤 @${escapeHtml(customer.username || 'N/A')} • Status: ${escapeHtml(customer.status || 'N/A')}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (provider) {
                const providerName = provider.fullName || `${provider.firstName || ''} ${provider.lastName || ''}`.trim() || booking?.providerName || 'Unknown Provider';
                const tierClass = `tier-${(provider.tier || 'bronze').toLowerCase()}`;
                content += `
                    <div class="section">
                        <h3>🏢 Provider Information</h3>
                        <div class="user-card">
                            ${provider.profilePhoto ? 
                                `<img src="${provider.profilePhoto}" class="user-avatar" onerror="this.outerHTML='<div class=\\'user-avatar-placeholder\\'>${getInitials(provider.firstName, provider.lastName)}</div>'">` :
                                `<div class="user-avatar-placeholder">${getInitials(provider.firstName, provider.lastName)}</div>`
                            }
                            <div class="user-details">
                                <h4>${escapeHtml(providerName)} ${provider.tier ? `<span class="tier-badge ${tierClass}">${provider.tier}</span>` : ''}</h4>
                                <p>📧 ${escapeHtml(provider.email || provider.identity?.email || 'N/A')}</p>
                                <p>📞 ${escapeHtml(provider.phone || provider.identity?.phone || booking?.providerPhone || 'N/A')}</p>
                                <p>👤 @${escapeHtml(provider.username || 'N/A')} • Status: ${escapeHtml(provider.status || 'N/A')}</p>
                                ${provider.profile ? `
                                    <p>🎯 ${escapeHtml(provider.profile.primaryDomain || 'N/A')} • Experience: ${provider.profile.experience || 0} years</p>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            content += `
                <div class="reason-box">
                    <h4>📝 Cancellation Reason</h4>
                    <p>${escapeHtml(data.reason || 'No reason provided')}</p>
                </div>
            `;

            if (data.evidenceUrls && data.evidenceUrls.length > 0) {
                content += `
                    <div class="evidence-section">
                        <h3>📎 Evidence Attached</h3>
                        <div class="image-gallery">
                            ${data.evidenceUrls.map(url => `
                                <img src="${url}" class="gallery-image" onclick="window.open('${url}', '_blank')" onerror="this.style.display='none'">
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const bookingAmount = booking?.estimatedSubtotal || booking?.selectedPricing?.price || booking?.amount || 0;

            content += `
                <div class="section">
                    <h3>ℹ️ Request Details</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Requested By</div>
                            <div class="info-value">${escapeHtml(data.who || data.cancelledBy || 'Unknown')}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Request Date</div>
                            <div class="info-value">${formatDate(data.when)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div class="info-value">${escapeHtml(data.status || 'pending')}</div>
                        </div>
                        ${data.refundPercent !== undefined ? `
                            <div class="info-item">
                                <div class="info-label">Refund Percentage</div>
                                <div class="info-value">${data.refundPercent}%</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Refund Amount</div>
                                <div class="info-value" style="color: #28a745; font-weight: 600; font-size: 18px;">₹${(data.refundAmount || calculateRefund(getAdvancePaid(booking), data.refundPercent)).toLocaleString('en-IN')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Booking Amount</div>
                                <div class="info-value">₹${(data.bookingAmount || bookingAmount).toLocaleString('en-IN')}</div>
                            </div>
                        ` : ''}
                        ${data.decidedAt ? `
                            <div class="info-item">
                                <div class="info-label">Decided At</div>
                                <div class="info-value">${formatDate(data.decidedAt)}</div>
                            </div>
                        ` : ''}
                        ${data.adminNote ? `
                            <div class="info-item" style="grid-column: 1/-1;">
                                <div class="info-label">Admin Note</div>
                                <div class="info-value">${escapeHtml(data.adminNote)}</div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('modal-body').innerHTML = content;

            const actionsEl = document.getElementById('modal-actions');
            const status = (data.status || 'pending').toLowerCase();
            
            if (status === 'pending') {
                actionsEl.innerHTML = `
                    <button class="btn btn-deny" onclick="denyRequest()">❌ Deny Request</button>
                    <button class="btn btn-approve" onclick="approveRequest()">✅ Approve & Refund</button>
                `;
            } else {
                actionsEl.innerHTML = `
                    <button class="btn btn-cancel" onclick="closeModal()">Close</button>
                `;
            }

            document.getElementById('detail-modal').classList.add('active');
        }

        async function approveRequest() {
            if (!currentRequest) return;

            const refund = prompt('Enter refund percentage (0-100):', '100');
            if (refund === null) return;

            const refundPercent = parseFloat(refund);
            if (isNaN(refundPercent) || refundPercent < 0 || refundPercent > 100) {
                alert('Invalid refund percentage');
                return;
            }

            const note = prompt('Add an admin note (optional):');

            // Get booking amount and calculate refund
            const booking = await getBooking(currentRequest.bookingId);
            const bookingAmount = booking?.estimatedSubtotal || booking?.selectedPricing?.price || booking?.amount || 0;
            // ✅ Refund is always from the ADVANCE PAID (10%), not the full booking value
            const advancePaid = getAdvancePaid(booking);
            const refundAmount = calculateRefund(advancePaid, refundPercent);

            console.log('💰 Refund Calculation:', {
                bookingId: currentRequest.bookingId,
                totalBookingAmount: bookingAmount,
                advancePaid,
                refundPercent,
                calculatedRefundAmount: refundAmount,
                note: 'Refund is from advance paid only'
            });

            try {
                // ✅ 1. UPDATE CANCELLATION_REQUESTS COLLECTION
                await db.collection('cancellation_requests').doc(currentRequest.id).update({
                    status: 'approved',
                    refundPercent: refundPercent,
                    refundAmount: refundAmount,
                    advancePaid: advancePaid,
                    bookingAmount: bookingAmount,
                    decidedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    adminNote: note || '',
                    approvedBy: 'admin',
                    processedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                console.log('✅ Updated cancellation_requests collection');

                // ✅ 2. UPDATE BOOKINGS COLLECTION
                if (currentRequest.bookingId) {
                    const bookingRef = db.collection('bookings').doc(currentRequest.bookingId);

                    await bookingRef.update({
                        'cancelRequest.status': 'approved',
                        'cancelRequest.refundPercent': refundPercent,
                        'cancelRequest.refundAmount': refundAmount,
                        'cancelRequest.finalRefundAmount': refundAmount,
                        'cancelRequest.approvedRefundAmount': refundAmount,
                        'cancelRequest.advancePaid': advancePaid,
                        'cancelRequest.by': currentRequest.who || 'customer',
                        'cancelRequest.userChoice': currentRequest.userChoice || 'refund',
                        'cancelRequest.reason': currentRequest.reason || '',
                        'cancelRequest.prevStatus': booking?.status || 'Pending',
                        'cancelRequest.approvedAt': firebase.firestore.FieldValue.serverTimestamp(),
                        'cancelRequest.adminNote': note || '',
                        'status': 'Cancelled',
                        'refundStatus': {
                            status: 'completed',
                            amount: refundAmount,
                            percent: refundPercent,
                            advancePaid: advancePaid,
                            processedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            processedBy: 'admin'
                        },
                        'refundInitiated': true,
                        'updatedAt': firebase.firestore.FieldValue.serverTimestamp()
                    });

                    console.log('✅ Updated bookings collection with refund data');
                }

                alert(`✅ Request approved successfully!\n\nRefund: ${refundPercent}%\nAmount: ₹${refundAmount.toLocaleString('en-IN')}`);
                closeModal();
                loadAllRequests();
            } catch (error) {
                console.error('❌ Error approving request:', error);
                alert('Error: ' + error.message);
            }
        }

        async function denyRequest() {
            if (!currentRequest) return;

            const note = prompt('Add a reason for denial:');
            if (note === null) return;

            try {
                // ✅ 1. UPDATE CANCELLATION_REQUESTS COLLECTION
                await db.collection('cancellation_requests').doc(currentRequest.id).update({
                    status: 'denied',
                    decidedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    adminNote: note || 'Request denied by admin',
                    deniedBy: 'admin',
                    processedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                console.log('✅ Updated cancellation_requests collection - DENIED');

                // ✅ 2. UPDATE BOOKINGS COLLECTION
                if (currentRequest.bookingId) {
                    const booking = await getBooking(currentRequest.bookingId);
                    const bookingRef = db.collection('bookings').doc(currentRequest.bookingId);

                    await bookingRef.update({
                        'cancelRequest.status': 'denied',
                        'cancelRequest.by': currentRequest.who || 'customer',
                        'cancelRequest.reason': currentRequest.reason || '',
                        'cancelRequest.deniedAt': firebase.firestore.FieldValue.serverTimestamp(),
                        'cancelRequest.adminNote': note || 'Request denied by admin',
                        'cancelRequest.prevStatus': booking?.status || 'Pending',
                        'status': booking?.cancelRequest?.prevStatus || booking?.status || 'Pending',
                        'updatedAt': firebase.firestore.FieldValue.serverTimestamp()
                    });

                    console.log('✅ Updated bookings collection - DENIED, status restored');
                }

                alert('❌ Request denied');
                closeModal();
                loadAllRequests();
            } catch (error) {
                console.error('❌ Error denying request:', error);
                alert('Error: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            currentRequest = null;
        }

        async function getBooking(bookingId) {
            if (!bookingId) return null;
            if (cache.bookings[bookingId]) return cache.bookings[bookingId];

            try {
                const doc = await db.collection('bookings').doc(bookingId).get();
                if (doc.exists) {
                    cache.bookings[bookingId] = doc.data();
                    return doc.data();
                }
            } catch (error) {
                console.error('Error fetching booking:', error);
                return null;
            }
        }

        async function getUser(userId) {
            if (!userId) return null;
            if (cache.users[userId]) return cache.users[userId];

            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    cache.users[userId] = doc.data();
                    return doc.data();
                }
            } catch (error) {
                console.error('Error fetching user:', error);
                return null;
            }
        }

        async function getProvider(providerId) {
            if (!providerId) return null;
            if (cache.providers[providerId]) return cache.providers[providerId];

            try {
                const doc = await db.collection('providers').doc(providerId).get();
                if (doc.exists) {
                    cache.providers[providerId] = doc.data();
                    return doc.data();
                }
            } catch (error) {
                console.error('Error fetching provider:', error);
                return null;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                let date;
                if (typeof timestamp === 'string') {
                    date = new Date(timestamp);
                } else if (timestamp.toDate) {
                    date = timestamp.toDate();
                } else {
                    date = new Date(timestamp);
                }
                return date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return 'Invalid Date';
            }
        }

        function getInitials(firstName, lastName) {
            if (!firstName && !lastName) return '?';
            const first = firstName ? firstName[0] : '';
            const last = lastName ? lastName[0] : '';
            return (first + last).toUpperCase();
        }

        // Close modal when clicking outside
        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') {
                closeModal();
            }
        });
    </script>
